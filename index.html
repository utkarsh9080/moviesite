<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Very Serious Scientific Investigation 🍿</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#efe4cb; --cream-2:#f6eeda; --paper:#fbf5e6;
  --ink:#26324e; --ink-soft:#5a637d;
  --red:#b23a2a; --red-deep:#8f2b1f;
  --mustard:#d8a52f; --orange:#d0762f; --purple:#6f5d94; --green:#5f7d4c;
  --display:"Alfa Slab One",Georgia,serif;
  --mono:"Special Elite","Courier New",monospace;
  --hand:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--cream);color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font:inherit;color:inherit}
::selection{background:var(--mustard);color:var(--ink)}
:focus-visible{outline:3px dashed var(--orange);outline-offset:3px;border-radius:2px}

.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.backdrop__grid{position:absolute;inset:0;background-image:linear-gradient(rgba(38,50,78,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(38,50,78,.05) 1px,transparent 1px);background-size:44px 44px}
.backdrop__grain{position:absolute;inset:0;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.06'/></svg>")}
.backdrop__eq{position:absolute;font-family:var(--mono);color:var(--ink);opacity:.09;font-size:19px}
.backdrop__atom{position:absolute;color:var(--purple);opacity:.12;width:70px}
.atom1{top:15%;left:7%;transform:rotate(-12deg)}
.atom2{bottom:12%;right:9%;width:54px;transform:rotate(20deg)}
@media(max-width:640px){.backdrop__eq{display:none}}

.file-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:16px;padding:11px 16px;background:rgba(239,228,203,.88);border-bottom:2px solid rgba(38,50,78,.18);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);backdrop-filter:blur(3px)}
.file-header__id{color:var(--red-deep);font-weight:700}
.file-header__dots{display:inline-flex;align-items:center}
.dot{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;border:2px solid var(--ink-soft)}
.dot--on{background:var(--red);border-color:var(--red-deep)}
.file-header__meta{font-size:11px;opacity:.7}
@media(max-width:480px){.file-header__meta{display:none}}

.page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:110px 22px 90px}
.page--in{animation:pageInA .5s cubic-bezier(.2,.85,.3,1) both}
.page--v1.page--in{animation-name:pageInB}
.page--v2.page--in{animation-name:pageInC}
.page--out{animation:pageOut .2s ease-in both}
@keyframes pageInA{from{opacity:0;transform:translateY(30px)}}
@keyframes pageInB{from{opacity:0;transform:translateY(12px) translateX(44px) rotate(.4deg)}}
@keyframes pageInC{from{opacity:0;transform:scale(.94)}}
@keyframes pageOut{to{opacity:0;transform:translateY(-14px)}}
.page__inner{display:flex;flex-direction:column;align-items:flex-start;gap:26px}
.page__inner--center{align-items:center;text-align:center;position:relative}

.big-title{position:relative;font-family:var(--display);font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.1;margin:0;text-shadow:3px 3px 0 rgba(216,165,47,.35)}
.big-title--mid{font-size:clamp(1.8rem,5.2vw,3.2rem)}
.big-title__name{color:var(--red)}
.big-title__scribble{position:absolute;left:0;bottom:-16px;color:var(--mustard)}
.kicker{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.tease{margin:0;font-size:clamp(1.15rem,2.6vw,1.5rem)}
.caret{display:inline-block;width:10px;height:1.05em;background:var(--red);margin-left:4px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hand-note{font-family:var(--hand);font-size:1.25rem;color:var(--ink-soft);transform:rotate(-1.5deg);margin:0}
.hand-note--margin{align-self:center;transform:rotate(-2deg)}
.micro-note{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);opacity:.85;margin:0}
.scribble{display:block}

.stamp{display:inline-block;white-space:nowrap;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:4px 12px;border:2px solid currentColor;border-radius:3px;transform:rotate(var(--rot,-5deg));opacity:.92;background:rgba(251,245,230,.55)}
.stamp--red{color:var(--red-deep)}.stamp--navy{color:var(--ink)}.stamp--green{color:var(--green)}.stamp--purple{color:var(--purple)}
.stamp--big{font-size:16px;padding:8px 18px}
.stamp-row{display:flex;flex-wrap:wrap;gap:14px 20px}
.tape{position:absolute;width:92px;height:26px;background:rgba(216,165,47,.4);border-left:1px dashed rgba(38,50,78,.25);border-right:1px dashed rgba(38,50,78,.25);box-shadow:0 2px 4px rgba(38,50,78,.12);transform:rotate(-4deg)}
.tape--left{top:-13px;left:26px;transform:rotate(-7deg)}
.tape--right{top:-13px;right:26px;transform:rotate(5deg)}
.dashed-arrow{width:90px;color:var(--ink-soft);opacity:.5;transform:rotate(18deg)}

.btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:16px;font-weight:700;border:3px solid var(--ink);border-radius:4px;padding:14px 26px;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn--primary{background:var(--red);color:var(--paper);border-color:var(--red-deep);box-shadow:4px 4px 0 var(--red-deep)}
.btn--primary:hover{box-shadow:6px 6px 0 var(--red-deep)}
.btn--yes{background:var(--green);color:#fdf8ec;border-color:#46603a;font-size:18px;padding:16px 30px;box-shadow:4px 4px 0 #46603a}
.btn--yes:hover{box-shadow:6px 6px 0 #46603a}
.cta-block{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cta-block__note{transform:rotate(-4deg)}

.polaroid{position:relative;background:var(--paper);padding:12px 12px 10px;border:2px solid rgba(38,50,78,.85);box-shadow:0 14px 28px rgba(38,50,78,.18);transform:rotate(var(--rot,-3deg));transition:transform .25s ease,box-shadow .25s ease;max-width:320px;width:100%}
.polaroid:hover{transform:rotate(0deg) translateY(-6px);box-shadow:0 20px 34px rgba(38,50,78,.22)}
.polaroid .tape{top:-14px;left:50%;margin-left:-46px;transform:rotate(-5deg)}
.polaroid__imgwrap{position:relative;background:#e9e2cf}
.polaroid img{display:block;width:100%;height:auto;filter:saturate(.96) contrast(1.03) sepia(.06)}
.polaroid__obs{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.16em;background:rgba(38,50,78,.85);color:var(--cream-2);padding:2px 7px;border-radius:2px}
.polaroid figcaption{padding:10px 4px 4px;display:flex;flex-direction:column;gap:3px;text-align:left}
.polaroid__label{font-size:11px;letter-spacing:.16em;color:var(--red-deep);text-transform:uppercase}
.polaroid__caption{font-family:var(--hand);font-size:1.3rem;line-height:1.15}
.polaroid__status{font-size:10.5px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
.evidence{position:relative;width:100%}
.evidence__heading{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 20px}
.evidence__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px;align-items:start;justify-items:center}
.evidence__photo--2{margin-top:30px}.evidence__photo--3{margin-top:10px}
.evidence__arrow{position:absolute;top:28%;left:30%}
.evidence__note{font-family:var(--hand);color:var(--ink-soft);margin-top:20px;transform:rotate(-1deg)}
@media(max-width:760px){.evidence__grid{grid-template-columns:1fr;gap:34px}.evidence__photo--2,.evidence__photo--3{margin-top:0}.evidence__arrow{display:none}.page{padding-top:96px}}

.doc{position:relative;width:100%;max-width:720px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:0 16px 34px rgba(38,50,78,.16);padding:36px clamp(20px,6vw,56px) 32px;transform:rotate(-.4deg)}
.doc--form{transform:rotate(.35deg)}
.doc__header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.doc__kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.doc__filetab{background:var(--ink);color:var(--cream-2);padding:4px 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.doc__title{font-family:var(--display);font-size:clamp(1.6rem,4.2vw,2.5rem);line-height:1.18;margin:0 0 20px;position:relative}
.doc__title .scribble{position:absolute;left:0;bottom:-12px}
.doc__footer{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;margin-top:30px}
.doc__atom{color:var(--purple);opacity:.35;width:46px;flex-shrink:0}
.doc__sig{font-family:var(--hand);font-size:1.4rem;color:var(--ink-soft)}

.letter__framing{font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.85;margin:0 0 22px}
.letter__dedication{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.1rem);color:var(--red-deep);margin:0 0 26px;position:relative;width:fit-content}
.letter__dedication .scribble{position:absolute;left:0;bottom:-10px;color:var(--mustard)}
.letter__tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.letter__body{position:relative;padding:20px 8px 24px 14px;margin:0 0 16px;background-image:repeating-linear-gradient(transparent 0 33px,rgba(111,93,148,.28) 33px 35px);border-left:3px solid rgba(178,58,42,.5)}
.letter__body p{font-family:var(--hand);font-size:1.45rem;line-height:35px;margin:0;white-space:pre-line}
.letter__ps{font-family:var(--hand);font-size:1.2rem;color:var(--ink-soft);margin:0;transform:rotate(-1deg)}

.hypo__body{border:2px dashed rgba(38,50,78,.35);padding:18px 20px;margin:0 0 24px;background:rgba(246,238,218,.6)}
.hypo__body p{margin:0;font-family:var(--hand);font-size:1.35rem;line-height:1.5}
.fields{margin:0 0 24px;border-top:2px solid rgba(38,50,78,.3)}
.field{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:11px 4px;align-items:baseline;border-bottom:1px dashed rgba(38,50,78,.3)}
.field__label{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red-deep)}
.field__value{font-size:.98rem}
@media(max-width:560px){.field{grid-template-columns:1fr;gap:2px}}
.meter{display:flex;align-items:center;gap:12px}
.meter__label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.meter__bar{flex:1;height:14px;border:2px solid var(--ink);background:var(--cream-2);position:relative}
.meter__bar i{position:absolute;top:2px;bottom:2px;left:2px;width:99.7%;background:repeating-linear-gradient(45deg,var(--green) 0 6px,#6d8f58 6px 12px)}
.meter__value{font-size:12px;color:var(--green);letter-spacing:.1em}

.question{position:relative;font-family:var(--display);font-size:clamp(1.4rem,4vw,2.3rem);line-height:1.25;margin:4px 0 0}
.question .scribble{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%)}
.choice{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:18px}
.choice__note{font-size:14.5px;color:var(--ink-soft);margin:10px 0 0;max-width:520px}

.no-btn{position:relative;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:16px;background:var(--cream-2);color:var(--red-deep);border:3px dashed var(--red-deep);border-radius:4px;padding:14px 26px;cursor:pointer;box-shadow:3px 3px 0 rgba(143,43,31,.35)}
.no-btn--fleeing{position:fixed;z-index:900;border-style:solid;box-shadow:0 12px 26px rgba(38,50,78,.25)}
.no-btn__inner{display:inline-block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.no-btn.shake{animation:shake .45s ease-in-out}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px) rotate(-2deg)}40%,60%{transform:translateX(5px) rotate(2deg)}}
.no-btn.glitch{animation:glitch .45s linear}
@keyframes glitch{0%{clip-path:inset(0 0 0 0)}20%{clip-path:inset(12% 0 60% 0);transform:translate(-4px,2px);text-shadow:2px 0 var(--red),-2px 0 var(--purple)}40%{clip-path:inset(60% 0 8% 0);transform:translate(4px,-2px);text-shadow:-2px 0 var(--red),2px 0 var(--mustard)}60%{clip-path:inset(30% 0 30% 0);transform:translate(-3px,1px) skewX(6deg)}80%{clip-path:inset(5% 0 75% 0);transform:translate(3px,-1px)}100%{clip-path:inset(0 0 0 0)}}
.no-ghost{display:flex;align-items:center;justify-content:center;border:3px dashed rgba(143,43,31,.4);border-radius:4px;color:rgba(143,43,31,.6);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:14px 26px;min-height:52px}
.sys-warning{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) rotate(-1deg);z-index:950;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--mustard);padding:9px 18px;border-radius:3px;box-shadow:0 10px 22px rgba(38,50,78,.35);max-width:90vw;text-align:center;animation:warnIn .25s ease-out}
@keyframes warnIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}

.confirmed{display:flex;align-items:center;gap:10px;margin:0;color:var(--green);font-weight:700;letter-spacing:.06em;font-size:1.2rem}
.stats{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;list-style:none;padding:0;margin:6px 0 0}
.stats li{font-size:13px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
.stats b{display:block;color:var(--red-deep);font-size:11px}
.floaties{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.floaties span{position:absolute;bottom:-30px;font-size:22px;color:var(--red);opacity:0;animation:floatUp 6s linear infinite}
.floaties span:nth-child(3n){color:var(--mustard)}.floaties span:nth-child(3n+1){color:var(--purple)}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.75}100%{transform:translateY(-85vh) rotate(24deg);opacity:0}}

.finale__title{font-family:var(--display);font-size:clamp(1.7rem,5vw,3rem);line-height:1.25;margin:0;max-width:720px}
.slots{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.slot{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);background:var(--paper);padding:12px 18px;cursor:pointer;box-shadow:3px 3px 0 rgba(38,50,78,.5);transform:rotate(var(--rot,0deg));transition:transform .15s,box-shadow .15s,background .15s}
.slot:nth-child(1){--rot:-2deg}.slot:nth-child(2){--rot:1.5deg}.slot:nth-child(3){--rot:-1deg;background:var(--mustard)}
.slot:hover{transform:rotate(0deg) translateY(-3px)}
.slot--picked{background:var(--green);color:#fdf8ec;box-shadow:3px 3px 0 #46603a}
.finale__status{margin-top:24px;display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);border:2px solid rgba(38,50,78,.25);border-radius:999px;padding:8px 18px;background:rgba(251,245,230,.7)}
.finale__status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.finale__egg{font-size:10.5px;letter-spacing:.22em;color:var(--ink-soft);opacity:.5;margin-top:36px;text-transform:uppercase}

/* preview tag — delete this rule + the div in body when done testing */
.preview-tag{position:fixed;right:10px;bottom:10px;z-index:60;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);opacity:.6}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

/* ═══════════════ confetti ═══════════════ */
const CONFETTI_COLORS = ["#b23a2a","#d8a52f","#d0762f","#6f5d94","#5f7d4c","#26324e","#fbf5e6"];
function fireConfetti(durationMs = 2800) {
  if (reduced) return;
  const canvas = document.createElement("canvas");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.setAttribute("style","position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;");
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  if (!ctx) { canvas.remove(); return; }
  ctx.scale(dpr, dpr);
  const parts = [];
  const spawn = (x,y,n,spread,power) => {
    for (let i=0;i<n;i++) {
      const a = -Math.PI/2 + (Math.random()-.5)*spread;
      const v = power*(.45+Math.random()*.75);
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*5,h:7+Math.random()*6,
        rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.35,c:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],round:Math.random()<.25});
    }
  };
  spawn(W*.5,H*.62,90,1.3,13); spawn(W*.1,H*.85,45,.9,15); spawn(W*.9,H*.85,45,.9,15);
  const start = performance.now(), fadeStart = durationMs*.55;
  const tick = (t) => {
    const el = t - start;
    ctx.clearRect(0,0,W,H);
    let alive = false;
    for (const p of parts) {
      p.vy += .26; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const alpha = el > fadeStart ? Math.max(0, 1-(el-fadeStart)/Math.max(durationMs-fadeStart,1)) : 1;
      if (alpha <= 0 || p.y > H+40) continue;
      alive = true;
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if (el < durationMs && alive) requestAnimationFrame(tick); else canvas.remove();
  };
  requestAnimationFrame(tick);
}

    html: () => {

      const glyphs = ["✨","✦","✧","★"];

      for (let i=0;i<14;i++) floaties += `<span style="left:${(i*71+9)%100}%;animation-delay:${(i%7)*.9}s;animation-duration:${5.5+(i%4)*1.3}s">${glyphs[i%4]}</span>`;
      return `<div class="page__inner page__inner--center">
        <div class="floaties" aria-hidden="true">${floaties}</div>

        <h2 class="big-title">${CONTENT.success.thanks}</h2>
        <p class="confirmed">
          <svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true" fill="none"><circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8 14.5 12.5 19 20 9.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

/* ═══════════════ the NO button ═══════════════ */
const NO_PARTICLE_COLORS = ["#b23a2a","#d8a52f","#d0762f","#6f5d94","#5f7d4c","#26324e"];
function spawnNoParticles(x, y) {
  for (let i=0;i<26;i++) {
    const p = document.createElement("span");
    const size = 4 + Math.random()*7;
    p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${NO_PARTICLE_COLORS[i%6]};z-index:998;pointer-events:none;border-radius:${Math.random()<.3?"50%":"2px"};`;
    document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2, dist = 50+Math.random()*130;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist-30;
    const anim = p.animate(
      [{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${(Math.random()*2-1)*540}deg)`,opacity:0}],
      {duration:450+Math.random()*350,easing:"cubic-bezier(.15,.6,.3,1)"}
    );
    anim.onfinish = () => p.remove();
    anim.oncancel = () => p.remove();
  }
}

function mountNoButton() {
  const btn = document.getElementById("noBtn");
  const ghost = document.getElementById("noGhost");
  const yes = document.getElementById("yesBtn");
  const inner = btn.querySelector(".no-btn__inner");
  const labels = CONTENT.experiment.noLabels;

  let stage = 0, fleeing = false, pos = null, hidden = false, busy = false, lastPoke = 0, warnTimer;
  const scale = () => Math.max(1 - Math.max(0, stage - labels.length) * .05, .72);

  const flash = (msg) => {
    let w = document.getElementById("sysWarn");
    if (!w) {
      w = document.createElement("div");
      w.id = "sysWarn"; w.className = "sys-warning";
      w.setAttribute("role","status"); w.setAttribute("aria-live","polite");
      document.body.appendChild(w);
    }
    w.textContent = "⚠ " + msg;
    w.style.display = "block";
    clearTimeout(warnTimer);
    warnTimer = setTimeout(() => w.style.display = "none", 1900);
  };

  const applyState = () => {
    inner.textContent = labels[Math.min(stage, labels.length - 1)];
    btn.style.opacity = hidden ? 0 : 1;
    btn.style.pointerEvents = hidden ? "none" : "auto";
    btn.classList.toggle("no-btn--fleeing", fleeing);
    ghost.hidden = !fleeing;
    if (fleeing && pos) {
      btn.style.left = pos.x + "px";
      btn.style.top = pos.y + "px";
      btn.style.transform = `rotate(${(pos.x % 7) - 3}deg) scale(${scale()})`;
    } else {
      btn.style.transform = `scale(${scale()})`;
    }
  };

  const respawn = () => {
    const w = btn.offsetWidth || 96, h = btn.offsetHeight || 52;
    const vw = innerWidth, vh = innerHeight;
    const yr = yes ? yes.getBoundingClientRect() : null;
    let placed = false;
    for (let i = 0; i < 24 && !placed; i++) {
      const x = 14 + Math.random() * Math.max(vw - w - 28, 1);
      const y = 84 + Math.random() * Math.max(vh - h - 190, 40);
      const overlap = !!yr && !(x + w + 14 < yr.left || x - 14 > yr.right || y + h + 14 < yr.top || y - 14 > yr.bottom);
      if (!overlap) { pos = {x, y}; placed = true; }
    }
    if (!placed) pos = { x: Math.max(14,(vw-w)/2), y: Math.max(84,vh*.16) };
    applyState();
    inner.style.animation = "none"; void inner.offsetWidth; inner.style.animation = "";
  };

  const explode = () => {
    if (busy) return;
    busy = true;
    const r = btn.getBoundingClientRect();
    pos = { x: r.left, y: r.top };
    if (!reduced) spawnNoParticles(r.left + r.width/2, r.top + r.height/2);
    hidden = true; fleeing = true;
    applyState();
    setTimeout(() => { hidden = false; respawn(); busy = false; }, reduced ? 80 : 620);
  };

  const poke = () => {
    const now = performance.now();
    if (now - lastPoke < 380) return;
    lastPoke = now;
    stage++;
    inner.textContent = labels[Math.min(stage, labels.length - 1)];

    if (stage === 1) {
      flash(CONTENT.experiment.warningFirst);
      if (!reduced) {
        btn.classList.add("shake");
        setTimeout(() => btn.classList.remove("shake"), 500);
      }
      return;
    }
    if (stage === 2) {
      flash(CONTENT.experiment.glitchNotes[0]);
      if (!reduced) {
        btn.classList.add("glitch");
        setTimeout(() => btn.classList.remove("glitch"), 620);
      }
      return;
    }
    flash(CONTENT.experiment.glitchNotes[(stage - 3) % CONTENT.experiment.glitchNotes.length]);
    explode();
  };

  btn.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") poke(); });
  btn.addEventListener("touchstart", e => { e.preventDefault(); poke(); }, { passive: false });
  btn.addEventListener("click", poke);
  btn.addEventListener("focus", poke);

  window.addEventListener("resize", () => {
    if (!fleeing || !pos) return;
    const w = btn.offsetWidth, h = btn.offsetHeight;
    pos = {
      x: Math.min(Math.max(pos.x, 12), Math.max(innerWidth - w - 12, 12)),
      y: Math.min(Math.max(pos.y, 76), Math.max(innerHeight - h - 90, 76)),
    };
    applyState();
  });
}

/* ═══════════════ navigation ═══════════════ */
function renderHeader() {
  let dots = "";
  for (let i = 0; i < 6; i++) dots += `<span class="dot${i <= page ? " dot--on" : ""}"></span>`;
  headerEl.innerHTML =
    `<span class="file-header__id">FILE&nbsp;06/${String(page + 1).padStart(2, "0")}</span>` +
    `<span class="file-header__dots" role="img" aria-label="Step ${page + 1} of 6">${dots}</span>` +
    `<span class="file-header__meta">EYES&nbsp;ONLY</span>`;
}

function render() {
  renderHeader();
  app.className = "";
  void app.offsetWidth;
  app.className = `page page--in page--v${page % 3}`;
  app.innerHTML = PAGES[page].html();
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
  if (PAGES[page].mount) PAGES[page].mount();
}

function go(next) {
  if (next === page || next < 0 || next > 5) return;
  if (reduced) { page = next; render(); scrollTo(0, 0); return; }
  app.className = "page page--out";
  setTimeout(() => { page = next; render(); scrollTo(0, 0); }, 200);
}

render();
</script>
